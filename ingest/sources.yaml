# Sources officielles collectées par ingest/crawl.py.
# Seuls les sites publics des autorités suisses sont utilisés, pour que chaque
# réponse de l'assistant puisse renvoyer vers une page officielle.

user_agent: "assistant-rag-suisse/1.0 (+https://github.com/Toumil94/assistant-rag-suisse)"
delay_seconds: 1.0        # politesse : une requête par seconde et par site
max_depth: 2

sites:
  - name: ch.ch (portail officiel de la Confédération)
    domain: www.ch.ch
    allow_prefixes: ["/fr/"]
    keyword_filter: false     # tout le portail concerne la vie quotidienne en Suisse
    max_pages: 350
    seeds:
      - https://www.ch.ch/fr/
      - https://www.ch.ch/fr/documents-et-registre/
      - https://www.ch.ch/fr/impots-et-finances/
      - https://www.ch.ch/fr/sante/
      - https://www.ch.ch/fr/travail/
      - https://www.ch.ch/fr/logement/
      - https://www.ch.ch/fr/securite-sociale/
      - https://www.ch.ch/fr/vehicules-et-circulation/
      - https://www.ch.ch/fr/famille-et-partenariat/
      - https://www.ch.ch/fr/etrangers/

  - name: ge.ch (État de Genève)
    domain: www.ge.ch
    allow_prefixes: ["/"]
    keyword_filter: true
    max_pages: 220
    seeds:
      - https://www.ge.ch/
      - https://www.ge.ch/demander-permis-travail-frontalier
      - https://www.ge.ch/impot-source
      - https://www.ge.ch/assurance-maladie
      - https://www.ge.ch/dossier/arriver-geneve
      - https://www.ge.ch/annoncer-mon-arrivee-geneve
      - https://www.ge.ch/permis-conduire

  - name: SEM (Secrétariat d'État aux migrations)
    domain: www.sem.admin.ch
    allow_prefixes: ["/sem/fr/"]
    keyword_filter: true
    max_pages: 80
    seeds:
      - https://www.sem.admin.ch/sem/fr/home/themen/aufenthalt.html
      - https://www.sem.admin.ch/sem/fr/home/themen/fza_schweiz-eu-efta.html

  - name: OFSP (assurance maladie)
    domain: www.bag.admin.ch
    allow_prefixes: ["/bag/fr/"]
    keyword_filter: true
    max_pages: 60
    seeds:
      - https://www.bag.admin.ch/bag/fr/home/versicherungen/krankenversicherung.html

  - name: AVS / AI
    domain: www.ahv-iv.ch
    allow_prefixes: ["/fr/", "/p/"]
    keyword_filter: true
    max_pages: 60
    seeds:
      - https://www.ahv-iv.ch/fr/

# Un lien n'est suivi (sur les sites avec keyword_filter) que si son adresse
# ou son texte contient l'un de ces mots, sans accents.
keywords:
  - permis
  - sejour
  - frontalier
  - etranger
  - arriv
  - install
  - demenag
  - annonce
  - impot
  - source
  - fiscal
  - assurance
  - maladie
  - lamal
  - prime
  - subside
  - avs
  - prevoyance
  - pilier
  - cotisation
  - chomage
  - travail
  - emploi
  - salaire
  - logement
  - bail
  - loyer
  - vehicule
  - conduire
  - plaque
  - famille
  - enfant
  - allocation
  - naturalisation
  - residence
  - aufenthalt
  - krankenversicherung
  - fza
  - ue
  - aele
